name: Update Visit Arizona calendar

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_calendar.py
      - name: Generate regional Arizona feeds
        run: python generate_regional_arizona.py
      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitarizona.ics
          for feed in sedona-events.ics mesa-events.ics flagstaff-events.ics; do
            if test -f "$feed"; then git add "$feed"; fi
          done
          git diff --cached --quiet || git commit -m "Update Visit Arizona calendar"
          git push
